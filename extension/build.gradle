plugins {
    id 'com.android.application'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream -> keystoreProperties.load(stream) }
}

dependencies {

    // Muzei API
    implementation 'com.google.android.apps.muzei:muzei-api:3.4.2'

    // Support libs
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
}

android {
    namespace 'com.simplecity.muzei.music'
    compileSdk 36

    defaultConfig {
        minSdk 21
        targetSdk 36

        versionName '2.2.0'
        versionCode 82
    }

    signingConfigs {
        release {
            // Release stays unsigned when keystore.properties is absent
            if (keystoreProperties.containsKey('store')) {
                storeFile file(keystoreProperties.getProperty('store'))
                keyAlias keystoreProperties.getProperty('alias')
                storePassword keystoreProperties.getProperty('storePass')
                keyPassword keystoreProperties.getProperty('pass')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), file('proguard-project.txt')
            if (keystoreProperties.containsKey('store')) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
